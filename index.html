<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layers — Layered Constraint Visualization</title>
    <script>
      // Apply the resolved theme before paint to avoid a flash of the wrong
      // theme. Mirrors ThemeSwitcher's resolution logic (src/ui/theme-switcher).
      (function () {
        try {
          var raw = localStorage.getItem("layers.theme");
          var pref = raw === "light" || raw === "dark" || raw === "system" ? raw : "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (_) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
